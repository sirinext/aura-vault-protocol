name: Kani Formal Verification

on:
  push:
    paths:
      - "aura-vault/src/share_math.rs"
      - "aura-vault/verification/**"
      - "aura-vault/Cargo.toml"
      - ".github/workflows/kani-verification.yml"
  pull_request:
    paths:
      - "aura-vault/src/share_math.rs"
      - "aura-vault/verification/**"
      - "aura-vault/Cargo.toml"
      - ".github/workflows/kani-verification.yml"
  workflow_dispatch:

jobs:
  share-math-proofs:
    name: Verify share accounting invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run Kani proofs
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.68.0"
          command: "cargo-kani"
          working-directory: "./aura-vault/verification"
